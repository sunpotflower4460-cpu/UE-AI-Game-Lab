; Lumi Stack - engine configuration.
; The game needs no project content: it boots the engine's empty Entry map and the
; C++ game mode spawns everything at runtime.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/LumiStack.LumiStackGameMode

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Mobile
AppliedTargetedHardwareClass=Mobile
DefaultGraphicsPerformance=Scalable
AppliedDefaultGraphicsPerformance=Scalable

[/Script/Engine.RendererSettings]
; Fully dynamic lighting, no baked data, no Lumen/VSM so desktop PIE looks like mobile.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
; Mobile: forward shading, HDR for bloom/tonemapping, 4x MSAA.
r.Mobile.ShadingPath=0
r.MobileHDR=True
r.Mobile.AntiAliasing=3
r.MSAACount=4
; The fill light is a movable point light: make sure mobile forward local lights are on.
r.Mobile.Forward.EnableLocalLights=1

[/Script/Engine.UserInterfaceSettings]
RenderFocusRule=Never

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
BundleDisplayName=Lumi Stack
BundleName=LumiStack
BundleIdentifier=com.sunpotflower.lumistack
VersionInfo=1.0.0
bSupportsPortraitOrientation=True
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=False
bSupportsLandscapeRightOrientation=False
bSupportsMetal=True
bSupportsMetalMRT=False
FrameRateLock=PUFRL_60
bEnableGameCenterSupport=False
bEnableCloudKitSupport=False
bEnableRemoteNotificationsSupport=False
bAutomaticSigning=True
; Legacy signing settings (pre-modern-Xcode workflow). UE 5.4+ reads XcodeProjectSettings below.
IOSTeamID=
AdditionalPlistData=<key>ITSAppUsesNonExemptEncryption</key><false/>

[/Script/MacTargetPlatform.XcodeProjectSettings]
; Modern Xcode workflow (UE 5.4+): set CodeSigningTeam to your Apple Developer Team ID.
bUseAutomaticCodeSigning=True
CodeSigningTeam=
CodeSigningPrefix=com.sunpotflower

[/Script/Engine.Engine]
bSmoothFrameRate=False
