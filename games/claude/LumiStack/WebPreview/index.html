<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
</head>
<body>
<title>Lumi Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@600;800&display=swap">
<style>
/* Layout: one full-bleed play field; the sky gradient is the page, HUD floats above it. */
:root {
  color-scheme: light;
  --ink: #12142a;            /* card text */
  --ink-soft: #4a4f6a;
  --paper: rgba(255, 255, 255, 0.86);
  --glass: rgba(10, 12, 40, 0.16);
  --white: #ffffff;
  --hot: #f0604e;            /* NEW BEST */
  --sky-top: #fdd6b5;
  --sky-bottom: #8fa3e0;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-ui: "Manrope", "Helvetica Neue", Arial, system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: #1a1d3a;
  color: var(--white);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#stage {
  position: relative;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  cursor: pointer;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  padding: max(16px, env(safe-area-inset-top, 0px)) 20px max(20px, env(safe-area-inset-bottom, 0px));
  display: grid;
}
.layer { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; min-height: 0; }
.shadow { text-shadow: 0 2px 6px rgba(0, 0, 20, 0.22); }

/* Title */
.title { padding-top: 9vh; gap: 0; }
.title h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(56px, 17vw, 96px);
  line-height: 0.92;
  letter-spacing: 0.06em;
  text-align: center;
}
.tagline { margin-top: 14px; font-weight: 800; font-size: 12px; letter-spacing: 0.32em; }
.spacer { flex: 1; }
.best { font-weight: 800; font-size: 14px; letter-spacing: 0.24em; margin-bottom: 14px; }
.tap { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.3em; animation: pulse 1.9s ease-in-out infinite; }
.credit { margin-top: 18px; font-size: 11px; letter-spacing: 0.04em; opacity: 0.78; text-align: center; max-width: 34ch; line-height: 1.45; }

/* In-run HUD */
.score {
  margin-top: 18px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(64px, 19vw, 104px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  transform-origin: 50% 60%;
}
.pill {
  margin-top: 8px;
  padding: 8px 18px 10px;
  border-radius: 18px;
  background: var(--glass);
  display: flex; flex-direction: column; align-items: center; gap: 7px;
}
.pill .label { font-weight: 800; font-size: 11px; letter-spacing: 0.2em; white-space: nowrap; }
.bar { width: 180px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--white); transition: width 0.25s ease-out; }

.popup { padding-top: 27vh; }
.popup span, .banner .big {
  font-family: var(--font-display); font-weight: 800; letter-spacing: 0.2em;
}
.popup span { font-size: 22px; display: inline-block; }
.banner { padding-top: 33vh; text-align: center; }
.banner .big { font-size: clamp(26px, 8vw, 40px); letter-spacing: 0.1em; display: block; }
.banner .small { display: block; margin-top: 8px; font-weight: 800; font-size: 12px; letter-spacing: 0.32em; }
.pop { animation: pop 0.95s cubic-bezier(.2,.9,.3,1.2) both; }
.banner.show .wrap { animation: bannerPop 2.6s ease both; display: inline-block; }

/* Result card */
.result { padding-top: 13vh; }
.card {
  box-sizing: border-box;
  width: min(300px, 100%);
  padding: 26px 40px 28px;
  border-radius: 28px;
  background: var(--paper);
  color: var(--ink);
  text-align: center;
  display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 18px 50px rgba(10, 12, 40, 0.18);
  animation: cardIn 0.4s cubic-bezier(.2,.9,.3,1.25) both;
}
.card .kicker { font-weight: 800; font-size: 12px; letter-spacing: 0.3em; color: var(--ink-soft); }
.card .num { font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.card .bestline { font-weight: 800; font-size: 14px; letter-spacing: 0.22em; color: var(--ink-soft); }
.card .bestline.new { color: var(--hot); }
.card .meta { margin-top: 12px; font-size: 11px; letter-spacing: 0.22em; color: var(--ink-soft); font-weight: 600; }
.result .tap { animation: fadeIn 0.3s 0.3s both, pulse 1.9s 0.6s ease-in-out infinite; }

.mute {
  position: absolute;
  top: max(14px, env(safe-area-inset-top, 0px));
  right: 14px;
  width: 40px; height: 40px;
  border: 0; border-radius: 20px;
  background: var(--glass);
  color: var(--white);
  display: grid; place-items: center;
  pointer-events: auto;
  cursor: pointer;
  z-index: 2;
}
.mute:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
.mute svg { width: 20px; height: 20px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; letter-spacing: 0.3em; font-size: 12px; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 12% { opacity: 1; } 30% { transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
@keyframes bannerPop { 0% { opacity: 0; transform: scale(0.7); } 6% { opacity: 1; } 14% { transform: scale(1.04); } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes cardIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
@keyframes bump { 0% { transform: scale(1.16); } 100% { transform: scale(1); } }
.bump { animation: bump 0.25s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .tap, .pop, .banner.show .wrap, .card, .bump { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; }
}
</style>

<div id="stage" role="application" aria-label="Lumi Stack game. Tap or press Space to drop the block.">
  <canvas id="gl"></canvas>
  <div class="loading" id="loading">LOADING</div>
  <button class="mute" id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/>
      <path id="wave1" d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path id="wave2" d="M18.5 5.5a9 9 0 0 1 0 13"/>
      <path id="cross" d="M16 9l6 6M22 9l-6 6" hidden/>
    </svg>
  </button>
  <div class="hud">
    <div class="layer title shadow" id="titleLayer" hidden>
      <h1>LUMI<br>STACK</h1>
      <div class="tagline">BUILD A TOWER OF LIGHT</div>
      <div class="spacer"></div>
      <div class="best" id="titleBest" hidden></div>
      <div class="tap">TAP TO START</div>
      <div class="credit">Browser preview. The same C++ game core as the Unreal Engine build, compiled to WebAssembly.</div>
    </div>
    <div class="layer shadow" id="playLayer" hidden>
      <div class="score" id="score">0</div>
      <div class="pill">
        <div class="label" id="stageLabel">STAGE 1/5 · DAWN</div>
        <div class="bar"><i id="stageBar"></i></div>
      </div>
    </div>
    <div class="layer popup shadow" id="popupLayer"><span id="popup"></span></div>
    <div class="layer banner shadow" id="bannerLayer"><div class="wrap"><span class="big" id="bannerBig"></span><span class="small" id="bannerSmall"></span></div></div>
    <div class="layer result" id="resultLayer" hidden>
      <div class="card">
        <div class="kicker" id="resKicker">GAME OVER</div>
        <div class="num" id="resScore">0</div>
        <div class="bestline" id="resBest">BEST 0</div>
        <div class="meta" id="resMeta">0F · STAGE 1</div>
      </div>
      <div class="spacer"></div>
      <div class="tap shadow" id="resTap">TAP TO RETRY</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const Phase = { Title: 0, Playing: 1, GameOver: 2, Won: 3 };
const Ev = { Reset: 0, Spawn: 1, Placed: 2, Sliced: 3, Grew: 4, StageClear: 5, Missed: 6, GameOver: 7, Won: 8 };
const Sfx = { Start: 0, Place: 1, Perfect: 2, Grow: 3, StageClear: 4, Miss: 5, Win: 6 };

// Same presentation constants as ALumiStackDirector (Unreal), in metres instead of cm.
const CAM = { distance: 23, pitch: 33, yaw: 45, portraitHFov: 32, landscapeVFov: 36, focusBelowTop: 1.2 };
const PEDESTAL_DEPTH = 16;
const deg = Math.PI / 180;

const $ = (id) => document.getElementById(id);
let core, mem, H = 0.5;

function f32(ptr, n) { return new Float32Array(core.memory.buffer, ptr, n); }
function cstr(ptr) {
  const bytes = new Uint8Array(core.memory.buffer, ptr);
  let end = 0; while (bytes[end] !== 0) end++;
  return new TextDecoder().decode(bytes.subarray(0, end));
}
function readBlock(arr, o) { return { cx: arr[o], cy: arr[o + 1], sx: arr[o + 2], sy: arr[o + 3], floor: arr[o + 4] | 0, stage: arr[o + 5] | 0 }; }
function buf(n) { return f32(core.lumi_buf(), n); }
function blockColor(b) { core.lumi_block_color(b.floor, b.stage); const c = buf(3); return new THREE.Color(c[0], c[1], c[2]); }
function sky(stage) { core.lumi_stage_sky(stage); const c = buf(6); return [[c[0], c[1], c[2]], [c[3], c[4], c[5]]]; }

// ---------------------------------------------------------------- persistence
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};
let best = store.get("lumistack.best", 0);
let muted = store.get("lumistack.muted", false);

// ---------------------------------------------------------------- audio
let actx = null;
const sfxCache = new Map();
function ensureAudio() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) actx = new AC();
}
function playSfx(id, param, vol = 1) {
  if (muted || !actx || vol <= 0) return;
  const key = id * 1000 + Math.min(999, Math.max(0, param));
  let ab = sfxCache.get(key);
  if (!ab) {
    const n = core.lumi_synth(id, param, actx.sampleRate);
    ab = actx.createBuffer(1, n, actx.sampleRate);
    ab.copyToChannel(f32(core.lumi_synth_ptr(), n).slice(), 0);
    sfxCache.set(key, ab);
  }
  const src = actx.createBufferSource();
  const g = actx.createGain();
  g.gain.value = 0.8 * vol;
  src.buffer = ab; src.connect(g); g.connect(actx.destination); src.start();
}
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* unsupported */ } }

// ---------------------------------------------------------------- three.js scene
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 400);
const hemi = new THREE.HemisphereLight(0xffffff, 0x9aa0c8, 0.62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff6ea, 0.72);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 60 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);
const boxGeo = new THREE.BoxGeometry(1, 1, 1);

// Unreal is Z-up; three.js is Y-up. Core (x, y, up) -> three (x, up, y).
function blockPos(b, pedestal) {
  const z = pedestal ? (H - (H + PEDESTAL_DEPTH) * 0.5) : (b.floor * H + H * 0.5);
  return new THREE.Vector3(b.cx, z, b.cy);
}
function blockScale(b, pedestal) { return new THREE.Vector3(b.sx, pedestal ? H + PEDESTAL_DEPTH : H, b.sy); }
function makeBlock(b, pedestal) {
  const color = pedestal ? (core.lumi_pedestal_color(), new THREE.Color(...buf(3))) : blockColor(b);
  const m = new THREE.Mesh(boxGeo, new THREE.MeshLambertMaterial({ color }));
  m.castShadow = true; m.receiveShadow = true;
  m.position.copy(blockPos(b, pedestal)); m.scale.copy(blockScale(b, pedestal));
  scene.add(m);
  return m;
}
function disposeMesh(m) { scene.remove(m); if (m.material.map) m.material.map.dispose(); m.material.dispose(); }

const ringTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"); const img = g.createImageData(128, 128);
  for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
    const u = (x + 0.5) / 64 - 1, v = (y + 0.5) / 64 - 1, d = Math.max(Math.abs(u), Math.abs(v));
    const a = Math.min(1, Math.exp(-(((d - 0.9) / 0.035) ** 2)) + 0.45 * Math.exp(-(((d - 0.9) / 0.12) ** 2))) * (d > 0.995 ? 0 : 1);
    const i = (y * 128 + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = a * 255;
  }
  g.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
})();
const ringGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);

let tower = [];      // {mesh, pos, scale}
let active = null;   // mesh
let debris = [];     // {mesh, vel, spin, life, shrinkAfter, base}
let rings = [];      // {mesh, age, sx, sy}
const focus = new THREE.Vector3(0, 0, 0);
let dist = CAM.distance, shake = 0;

function clearScene() {
  for (const t of tower) disposeMesh(t.mesh);
  if (active) disposeMesh(active);
  for (const d of debris) disposeMesh(d.mesh);
  for (const r of rings) disposeMesh(r.mesh);
  tower = []; active = null; debris = []; rings = [];
}
function rebuildTower() {
  clearScene();
  const n = core.lumi_tower_count();
  for (let i = 0; i < n; i++) {
    core.lumi_tower_block(i); const b = readBlock(buf(6), 0);
    const mesh = makeBlock(b, i === 0);
    tower.push({ mesh, pos: mesh.position.clone(), scale: mesh.scale.clone() });
  }
}
function topBlock() { core.lumi_tower_block(core.lumi_tower_count() - 1); return readBlock(buf(6), 0); }
function topSurface() { return (core.lumi_top_floor() + 1) * H; }

function spawnDebris(piece, axis, dir) {
  const mesh = makeBlock(piece, false);
  const out = axis === 0 ? new THREE.Vector3(dir, 0, 0) : new THREE.Vector3(0, 0, dir);
  debris.push({
    mesh, vel: out.multiplyScalar(1.2).add(new THREE.Vector3(0, 0.4, 0)),
    spin: axis === 0 ? new THREE.Vector3(0, 0, -dir * 1.6) : new THREE.Vector3(dir * 1.6, 0, 0),
    life: 0, shrinkAfter: 2.4, base: mesh.scale.clone(),
  });
}
function spawnBurst(b) {
  const c = blockPos(b, false).add(new THREE.Vector3(0, 0.6, 0));
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2, s = 0.12 + Math.random() * 0.1;
    const mesh = makeBlock({ ...b, floor: b.floor + i }, false);
    mesh.scale.setScalar(s); mesh.position.copy(c).add(new THREE.Vector3(Math.cos(a) * 0.6, 0, Math.sin(a) * 0.6));
    const sp = 2.5 + Math.random() * 2.7;
    debris.push({ mesh, vel: new THREE.Vector3(Math.cos(a) * sp, 5.2 + Math.random() * 3.8, Math.sin(a) * sp),
      spin: new THREE.Vector3(Math.random() * 12 - 6, Math.random() * 12 - 6, 0), life: 0, shrinkAfter: 1.4, base: new THREE.Vector3(s, s, s) });
  }
}
function spawnRing(b, color, strength) {
  const mat = new THREE.MeshBasicMaterial({ map: ringTex, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: strength });
  const mesh = new THREE.Mesh(ringGeo, mat);
  mesh.position.set(b.cx, (b.floor + 1) * H + 0.015, b.cy);
  scene.add(mesh);
  rings.push({ mesh, age: 0, sx: b.sx, sy: b.sy, strength });
}

// ---------------------------------------------------------------- HUD
let phaseAge = 0, lastPhase = -1, newBest = false;
function show(id, on) { $(id).hidden = !on; }
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function popup(text) { const el = $("popup"); el.textContent = text; restart(el, "pop"); }
function banner(big, small) { $("bannerBig").textContent = big; $("bannerSmall").textContent = small; restart($("bannerLayer"), "show"); }
function updateHud(phase) {
  if (phase !== lastPhase) {
    lastPhase = phase; phaseAge = 0;
    show("titleLayer", phase === Phase.Title);
    show("playLayer", phase === Phase.Playing);
    show("resultLayer", false);
    if (phase === Phase.Title) {
      $("titleBest").hidden = best <= 0; $("titleBest").textContent = "BEST  " + best;
      $("bannerLayer").classList.remove("show");
    }
  }
  if ((phase === Phase.GameOver || phase === Phase.Won) && phaseAge > 0.45 && $("resultLayer").hidden) {
    const won = phase === Phase.Won;
    $("resKicker").textContent = won ? "SUMMIT REACHED" : "GAME OVER";
    $("resScore").textContent = core.lumi_score();
    $("resBest").textContent = newBest ? "NEW BEST!" : "BEST  " + best;
    $("resBest").classList.toggle("new", newBest);
    $("resMeta").textContent = core.lumi_top_floor() + "F  ·  STAGE " + (core.lumi_stage() + 1);
    $("resTap").textContent = won ? "TAP TO PLAY AGAIN" : "TAP TO RETRY";
    show("resultLayer", true);
  }
  if (phase === Phase.Playing) {
    const s = core.lumi_stage();
    $("stageLabel").textContent = "STAGE " + (s + 1) + "/" + core.lumi_stage_count() + "  ·  " + cstr(core.lumi_stage_name(s));
    $("stageBar").style.width = Math.max(3, core.lumi_stage_progress() * 100) + "%";
  }
}

// Sky gradient blending between stage palettes.
let skyFrom = null, skyTo = null, skyBlend = 1;
function setSky(stage, instant) {
  const target = sky(stage);
  if (instant || !skyTo) { skyFrom = target; skyTo = target; skyBlend = 1; }
  else { skyFrom = currentSky(); skyTo = target; skyBlend = 0; }
  paintSky();
}
function mix(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }
function currentSky() { const e = skyBlend * skyBlend * (3 - 2 * skyBlend); return [mix(skyFrom[0], skyTo[0], e), mix(skyFrom[1], skyTo[1], e)]; }
function css(c) { return "rgb(" + c.map((v) => Math.round(v * 255)).join(",") + ")"; }
function paintSky() {
  const [t, b] = currentSky();
  const st = $("stage").style; st.setProperty("--sky-top", css(t)); st.setProperty("--sky-bottom", css(b));
  hemi.groundColor.setRGB(b[0] * 0.8, b[1] * 0.8, b[2] * 0.8);
}

// ---------------------------------------------------------------- events
function handleEvents() {
  const n = core.lumi_drain_events();
  if (!n) return;
  const stride = core.lumi_event_stride();
  const ev = f32(core.lumi_events_ptr(), n * stride).slice();
  const real = core.lumi_phase() !== Phase.Title;
  const vol = real ? 1 : 0;
  for (let i = 0; i < n; i++) {
    const o = i * stride, type = ev[o], axis = ev[o + 1], combo = ev[o + 2], stage = ev[o + 3], perfect = ev[o + 5] > 0;
    const block = readBlock(ev, o + 6), piece = readBlock(ev, o + 12);
    switch (type) {
      case Ev.Reset: rebuildTower(); setSky(0, false); newBest = false; break;
      case Ev.Spawn: if (active) disposeMesh(active); active = makeBlock(block, false); active.castShadow = true; break;
      case Ev.Placed: {
        const mesh = active || makeBlock(block, false); active = null;
        const entry = { mesh, pos: blockPos(block, false), scale: blockScale(block, false) };
        if (!perfect) { mesh.position.copy(entry.pos); mesh.scale.copy(entry.scale); }
        tower.push(entry);
        if (perfect) {
          spawnRing(block, blockColor(block).lerp(new THREE.Color(1, 1, 1), 0.6), 1);
          playSfx(Sfx.Perfect, combo, 0.9 * vol);
          if (real) { popup(combo >= 2 ? "PERFECT  ×" + combo : "PERFECT"); haptic(12); }
        } else {
          playSfx(Sfx.Place, block.floor, 0.8 * vol);
          if (real) haptic(6);
        }
        if (real) { $("score").textContent = core.lumi_score(); restart($("score"), "bump"); }
        break;
      }
      case Ev.Sliced: case Ev.Missed: {
        const t = topBlock();
        const dir = axis === 0 ? (piece.cx >= t.cx ? 1 : -1) : (piece.cy >= t.cy ? 1 : -1);
        if (type === Ev.Missed && active) { disposeMesh(active); active = null; }
        spawnDebris(piece, axis, dir);
        if (type === Ev.Missed) { playSfx(Sfx.Miss, 0, vol); if (real) shake = 0.35; }
        break;
      }
      case Ev.Grew: playSfx(Sfx.Grow, combo, 0.7 * vol); break;
      case Ev.StageClear: {
        const last = tower[tower.length - 1];
        if (last) { last.pos = blockPos(block, false); last.scale = blockScale(block, false); }
        spawnBurst(block); spawnRing(block, new THREE.Color(1, 1, 1), 1);
        playSfx(Sfx.StageClear, stage, vol); haptic([20, 40, 20]);
        const final = stage + 1 >= core.lumi_stage_count();
        banner(final ? "SUMMIT!" : "STAGE CLEAR", final ? "THE TOWER TOUCHES THE STARS" : "NEXT  " + cstr(core.lumi_stage_name(stage + 1)));
        if (!final) setSky(stage + 1, false);
        break;
      }
      case Ev.GameOver: case Ev.Won: {
        const score = core.lumi_score();
        newBest = score > best; best = Math.max(best, score); store.set("lumistack.best", best);
        if (type === Ev.Won) playSfx(Sfx.Win, 0, vol); else haptic(60);
        break;
      }
    }
  }
}

// ---------------------------------------------------------------- input
let lastTap = 0;
function tap() {
  const now = performance.now(); if (now - lastTap < 60) return; lastTap = now;
  ensureAudio();
  const phase = core.lumi_phase();
  if (phase === Phase.Title) { core.lumi_start(); playSfx(Sfx.Start, 0); }
  else if (phase === Phase.Playing) core.lumi_tap();
  else if (phaseAge > 0.7) { core.lumi_start(); playSfx(Sfx.Start, 0); }
  handleEvents();
}
$("stage").addEventListener("pointerdown", (e) => { if (e.button === 0 || e.pointerType !== "mouse") { e.preventDefault(); tap(); } });
window.addEventListener("keydown", (e) => {
  if ((e.code === "Space" || e.code === "Enter") && document.activeElement !== $("mute")) { e.preventDefault(); if (!e.repeat) tap(); }
});
function paintMute() {
  $("mute").setAttribute("aria-pressed", String(muted));
  $("mute").setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  $("wave1").toggleAttribute("hidden", muted); $("wave2").toggleAttribute("hidden", muted); $("cross").toggleAttribute("hidden", !muted);
}
$("mute").addEventListener("pointerdown", (e) => e.stopPropagation());
$("mute").addEventListener("click", (e) => { e.stopPropagation(); muted = !muted; store.set("lumistack.muted", muted); ensureAudio(); paintMute(); });

// ---------------------------------------------------------------- frame
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
}
function frame(dtRaw) {
  const dt = Math.min(dtRaw, 0.05);
  core.lumi_update(dt);
  handleEvents();
  const phase = core.lumi_phase();
  phaseAge += dt;

  if (active && core.lumi_has_active()) {
    core.lumi_active(); const b = readBlock(buf(6), 0);
    active.position.copy(blockPos(b, false)); active.scale.copy(blockScale(b, false));
  }
  const k = 1 - Math.exp(-dt * 16);
  for (const t of tower) { t.mesh.position.lerp(t.pos, k); t.mesh.scale.lerp(t.scale, k); }

  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i]; d.life += dt;
    d.vel.y -= 9.8 * dt; d.mesh.position.addScaledVector(d.vel, dt);
    d.mesh.rotation.x += d.spin.x * dt; d.mesh.rotation.z += d.spin.z * dt;
    const s = (d.life - d.shrinkAfter) / 0.6;
    if (s >= 1 || d.mesh.position.y < focus.y - 40) { disposeMesh(d.mesh); debris.splice(i, 1); }
    else if (s > 0) d.mesh.scale.copy(d.base).multiplyScalar(Math.max(0.01, 1 - s));
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.age += dt; const t = Math.min(1, r.age / 0.55);
    if (t >= 1) { disposeMesh(r.mesh); rings.splice(i, 1); continue; }
    const g = (1.12 + 0.55 * (1 - Math.pow(1 - t, 3))) * 1.1;
    r.mesh.scale.set(r.sx * g, 1, r.sy * g); r.mesh.material.opacity = r.strength * (1 - t);
  }

  // Camera: identical framing rules to the Unreal director.
  const aspect = camera.aspect || 0.5;
  const landH = 2 * Math.atan(Math.tan(CAM.landscapeVFov * 0.5 * deg) * aspect) / deg;
  const hFov = Math.min(120, Math.max(CAM.portraitHFov, landH));
  const halfV = Math.atan(Math.tan(hFov * 0.5 * deg) / aspect);
  camera.fov = (2 * halfV) / deg;
  const top = topBlock(), topZ = topSurface();
  const tf = new THREE.Vector3(top.cx, topZ - CAM.focusBelowTop, top.cy);
  let td = CAM.distance;
  if ((phase === Phase.GameOver || phase === Phase.Won) && phaseAge > 0.4) {
    const projected = (topZ + 1.5) * Math.cos(CAM.pitch * deg);
    tf.y = topZ * 0.5 + 0.6;
    td = Math.max(CAM.distance, (projected * 0.5 + 4.5) / Math.tan(halfV));
  }
  focus.lerp(tf, 1 - Math.exp(-dt * 4));
  dist += (td - dist) * (1 - Math.exp(-dt * 2.2));
  const fwd = new THREE.Vector3(Math.cos(CAM.pitch * deg) * Math.cos(CAM.yaw * deg), -Math.sin(CAM.pitch * deg), Math.cos(CAM.pitch * deg) * Math.sin(CAM.yaw * deg));
  camera.position.copy(focus).addScaledVector(fwd, -dist);
  if (shake > 0) { shake = Math.max(0, shake - dt); const a = 0.22 * (shake / 0.35); camera.position.add(new THREE.Vector3((Math.random() * 2 - 1) * a, (Math.random() * 2 - 1) * a, (Math.random() * 2 - 1) * a)); }
  camera.lookAt(focus);
  camera.updateProjectionMatrix();
  // Sun direction matches the Unreal light (pitch -58, yaw 17), mapped to Y-up.
  sun.position.copy(focus).add(new THREE.Vector3(-0.5, 0.85, -0.15).normalize().multiplyScalar(30));
  sun.target.position.copy(focus);

  if (skyBlend < 1) { skyBlend = Math.min(1, skyBlend + dt / 1.4); paintSky(); }
  updateHud(phase);
  renderer.render(scene, camera);
}

// Debug autopilot, matching `lumi.AutoPlay 1` in Unreal: add #autoplay to the URL.
const autoplay = location.hash === "#autoplay";
let autoPrev = 0, autoFloor = -1;
function autoStep() {
  if (!autoplay || core.lumi_phase() !== Phase.Playing || !core.lumi_has_active()) return;
  core.lumi_active(); const floor = buf(6)[4] | 0; const err = core.lumi_alignment_error();
  if (floor !== autoFloor) { autoFloor = floor; autoPrev = err; return; }
  if ((err <= 0) !== (autoPrev <= 0)) tap();
  autoPrev = err;
}

async function boot() {
  const bytes = Uint8Array.from(atob(WASM_BASE64), (c) => c.charCodeAt(0));
  const wasi = new Proxy({}, { get: () => () => 0 });
  const { instance } = await WebAssembly.instantiate(bytes, { wasi_snapshot_preview1: wasi });
  core = instance.exports;
  if (core._initialize) core._initialize();
  core.lumi_init((Math.random() * 0xffffffff) >>> 0 | 1);
  H = core.lumi_block_height();
  setSky(0, true);
  handleEvents();
  focus.set(0, topSurface() - CAM.focusBelowTop, 0);
  paintMute();
  resize();
  window.addEventListener("resize", resize);
  $("loading").hidden = true;
  let last = performance.now();
  const loop = (now) => { autoStep(); frame(Math.max(0, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
boot().catch((err) => { $("loading").textContent = "COULD NOT START: " + err.message; });
</script>

</body>
